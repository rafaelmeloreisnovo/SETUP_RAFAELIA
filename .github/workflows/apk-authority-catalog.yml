name: APK authority catalog - falsifiers (hash-only)
on:
  pull_request:
    paths:
      - 'incubator/RAFAELIA_APK_AUTHORITY/**'
      - '.github/workflows/apk-authority-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pinned checkout with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Offline adversarial tests
        run: python3 -m unittest discover -s incubator/RAFAELIA_APK_AUTHORITY/tests -v
      - name: Explicit scope
        run: echo "HASH_ONLY gate. Not APK signature, Play, HSM, freestanding or release approval."
